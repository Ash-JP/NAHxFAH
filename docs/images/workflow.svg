    <text x="28" y="75" fill="#00e5ff" font-family="sans-serif" font-size="13" font-weight="bold">Android ARCore App (Kotlin)</text>
    <text x="28" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Google ARCore 6DoF Camera</text>
    <text x="28" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; 3D Sceneview (Filament Engine)</text>
    <text x="28" y="142" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Compact Holographic Pill Badges</text>
    <text x="28" y="164" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Tap-to-Expand 175dp HUD Cards</text>
    <text x="28" y="186" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; 1-Tap 'Align AR' at Corner 1</text>
    <text x="28" y="208" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Depth-Sorted Billboard Projection</text>
    <rect x="28" y="222" width="244" height="28" rx="6" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="1"/>
    <text x="150" y="241" text-anchor="middle" fill="#00e5ff" font-family="sans-serif" font-size="10" font-weight="bold">LIVE AR HUD OVERLAY</text>

    <!-- Web Dashboard -->
    <rect x="15" y="305" width="270" height="185" rx="8" fill="#111c33" stroke="#b388ff" stroke-width="1.5"/>
    <text x="28" y="330" fill="#b388ff" font-family="sans-serif" font-size="13" font-weight="bold">Web Telemetry Dashboard</text>
    <text x="28" y="353" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Real-time 3D Canvas Visualizer</text>
    <text x="28" y="375" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; RSSI Signal Spectrum Graphs</text>
    <text x="28" y="397" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Live AP Grid &amp; BSSID Inspector</text>
    <text x="28" y="419" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Dark Cyberpunk Glassmorphism</text>
    <rect x="28" y="437" width="244" height="28" rx="6" fill="#b388ff" fill-opacity="0.1" stroke="#b388ff" stroke-width="1"/>
    <text x="150" y="456" text-anchor="middle" fill="#b388ff" font-family="sans-serif" font-size="10" font-weight="bold">PORT 8000 / INDEX.HTML</text>
  </g>
</svg>