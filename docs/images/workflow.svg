    <path d="M 780 450 L 860 480"/>
  </g>
  <text x="820" y="210" fill="#00e5ff" font-family="sans-serif" font-size="10" font-weight="bold">ap_update</text>
  <text x="820" y="470" fill="#b388ff" font-family="sans-serif" font-size="10" font-weight="bold">hubs_snapshot</text>

