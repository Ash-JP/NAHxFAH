    <rect width="280" height="36" rx="12" fill="#1e293b"/>
    <text x="140" y="24" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold">VENUE 4-CORNER RADAR FLEET</text>

    <!-- Hub 1 -->
    <rect x="15" y="50" width="250" height="95" rx="8" fill="#111c33" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="28" y="73" fill="#00e5ff" font-family="sans-serif" font-size="13" font-weight="bold">HUB-E44C6D (Corner 1)</text>
    <text x="28" y="93" fill="#94a3b8" font-family="sans-serif" font-size="11">Origin: (x=0.0m, y=0.0m, z=0.0m)</text>
    <text x="28" y="111" fill="#64748b" font-family="sans-serif" font-size="11">Windows WLAN API • 2.4/5GHz</text>
    <text x="28" y="129" fill="#00e676" font-family="sans-serif" font-size="10" font-weight="bold">[ACTIVE SCANNER]</text>

    <!-- Hub 2 -->
    <rect x="15" y="160" width="250" height="95" rx="8" fill="#111c33" stroke="#b388ff" stroke-width="1.5"/>
    <text x="28" y="183" fill="#b388ff" font-family="sans-serif" font-size="13" font-weight="bold">HUB-8D5EA1 (Corner 2)</text>
    <text x="28" y="203" fill="#94a3b8" font-family="sans-serif" font-size="11">Pos: (x=-1.56m, y=8.70m, z=-0.62m)</text>
    <text x="28" y="221" fill="#64748b" font-family="sans-serif" font-size="11">Continuous BSSID &amp; RSSI Harvest</text>
    <text x="28" y="239" fill="#00e676" font-family="sans-serif" font-size="10" font-weight="bold">[ACTIVE SCANNER]</text>

    <!-- Hub 3 -->
    <rect x="15" y="270" width="250" height="95" rx="8" fill="#111c33" stroke="#b388ff" stroke-width="1.5"/>
    <text x="28" y="293" fill="#b388ff" font-family="sans-serif" font-size="13" font-weight="bold">HUB-3D8C0D (Corner 3)</text>
    <text x="28" y="313" fill="#94a3b8" font-family="sans-serif" font-size="11">Pos: (x=-2.56m, y=11.94m, z=-0.69m)</text>
    <text x="28" y="331" fill="#64748b" font-family="sans-serif" font-size="11">Passive Wi-Fi Frame Monitoring</text>
    <text x="28" y="349" fill="#00e676" font-family="sans-serif" font-size="10" font-weight="bold">[ACTIVE SCANNER]</text>

    <!-- Hub 4 -->
    <rect x="15" y="380" width="250" height="95" rx="8" fill="#111c33" stroke="#b388ff" stroke-width="1.5"/>
    <text x="28" y="403" fill="#b388ff" font-family="sans-serif" font-size="13" font-weight="bold">HUB-C64D96 (Corner 4)</text>
    <text x="28" y="423" fill="#94a3b8" font-family="sans-serif" font-size="11">Pos: (x=-11.32m, y=10.85m, z=-0.79m)</text>
    <text x="28" y="441" fill="#64748b" font-family="sans-serif" font-size="11">Sub-second Beacon Sync</text>
    <text x="28" y="459" fill="#00e676" font-family="sans-serif" font-size="10" font-weight="bold">[ACTIVE SCANNER]</text>
  </g>

  <!-- FLOW 1 -> 2 -->
  <g stroke="#00e5ff" stroke-width="2" fill="none">
    <path d="M 320 200 L 400 240"/>
    <path d="M 320 350 L 400 350"/>
    <path d="M 320 500 L 400 460"/>
  </g>
  <text x="360" y="335" fill="#00e5ff" font-family="sans-serif" font-size="11" font-weight="bold">WebSocket</text>
  <text x="360" y="370" fill="#64748b" font-family="sans-serif" font-size="9">JSON 10Hz</text>

  <!-- GROUP 2: GO SERVER BACKEND -->
  <g transform="translate(400, 100)">
