<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="650" fill="url(#bgGrad)" rx="16"/>
  <rect width="1196" height="646" x="2" y="2" fill="none" stroke="#1e293b" stroke-width="2" rx="16"/>

  <text x="600" y="45" text-anchor="middle" fill="#00e5ff" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="bold" letter-spacing="2">WIFI HUNTER AR — SYSTEM ARCHITECTURE &amp; WORKFLOW</text>
  <text x="600" y="72" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="13">End-to-End Real-Time Multi-Lateration Pipeline &amp; Augmented Reality Visualization</text>

  <!-- GROUP 1: VENUE SCANNING FLEET -->
  <g transform="translate(40, 100)">
