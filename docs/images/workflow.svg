    <!-- Submodule 1 -->
    <rect x="15" y="50" width="350" height="80" rx="8" fill="#162033" stroke="#334155" stroke-width="1"/>
    <text x="30" y="73" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">1. WebSocket Hub Manager</text>
    <text x="30" y="93" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; /ws/hub (Laptops) &amp; /ws (Universal Client)</text>
    <text x="30" y="111" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Hub State Machine, Liveness &amp; Auth Tokens</text>

    <!-- Submodule 2 -->
    <rect x="15" y="145" width="350" height="95" rx="8" fill="#162033" stroke="#334155" stroke-width="1"/>
    <text x="30" y="168" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">2. Signal Processing &amp; Filtering</text>
    <text x="30" y="188" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; EMA (Exponential Moving Average) Smoothing</text>
    <text x="30" y="206" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Median Absolute Deviation (MAD) Outlier Filter</text>
    <text x="30" y="224" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Sliding Time Window Cache (45s window)</text>

    <!-- Submodule 3 -->
    <rect x="15" y="255" width="350" height="115" rx="8" fill="#162033" stroke="#00e676" stroke-width="1"/>
    <text x="30" y="278" fill="#00e676" font-family="sans-serif" font-size="13" font-weight="bold">3. 3D Localization Solver</text>
    <text x="30" y="298" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Log-Distance Model: PathLossA=-40dBm, N=2.4</text>
    <text x="30" y="316" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Coarse (0.3m) to Fine (0.05m) 3D Grid Search</text>
    <text x="30" y="334" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Frequency Attenuation (2.4 GHz vs 5 GHz)</text>
    <text x="30" y="352" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Stationary Hub Priority Weighting (3.0x)</text>

    <!-- Submodule 4 -->
    <rect x="15" y="385" width="350" height="105" rx="8" fill="#162033" stroke="#334155" stroke-width="1"/>
    <text x="30" y="408" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">4. Persistence &amp; Broadcasting</text>
    <text x="30" y="428" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; PostgreSQL 16 (observations, access_points)</text>
    <text x="30" y="446" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Real-Time Broadcast: ap_update &amp; hubs_snapshot</text>
    <text x="30" y="464" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Quality &amp; Confidence Rating [0% - 100%]</text>
  </g>

  <!-- FLOW 2 -> 3 -->
  <g stroke="#00e5ff" stroke-width="2.5" fill="none">
