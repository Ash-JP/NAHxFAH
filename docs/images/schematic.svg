<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#bgGrad3)" rx="16"/>
  <rect width="1196" height="636" x="2" y="2" fill="none" stroke="#1e293b" stroke-width="2" rx="16"/>

  <text x="600" y="45" text-anchor="middle" fill="#00e5ff" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="bold" letter-spacing="2">3D RF MULTI-LATERATION &amp; AR CALIBRATION SCHEMATIC</text>
  <text x="600" y="70" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="13">Log-Distance Path Loss Model, Least-Squares Likelihood Surface &amp; Coordinate Frame Transform</text>

  <!-- Left: Path Loss & Math -->
  <g transform="translate(50, 100)">
    <rect width="420" height="490" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="420" height="36" rx="12" fill="#1e293b"/>
    <text x="210" y="24" text-anchor="middle" fill="#00e5ff" font-family="sans-serif" font-size="13" font-weight="bold">LOG-DISTANCE PATH LOSS &amp; OPTIMIZATION</text>

    <text x="25" y="65" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">1. Log-Distance Model:</text>
    <rect x="25" y="75" width="370" height="40" rx="6" fill="#1e293b"/>
    <text x="210" y="100" text-anchor="middle" fill="#00e5ff" font-family="monospace" font-size="12" font-weight="bold">RSSI(d) = A - 10 &#183; n &#183; log10(d / d0) + X&#963;</text>

    <text x="25" y="135" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Reference Power A: -40.0 dBm @ 1.0 meter</text>
    <text x="25" y="153" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Path Loss Exponent n: 2.4 (Indoor Office Clutter)</text>
    <text x="25" y="171" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Shadow Fading Std Dev &#963;: 5.0 dBm</text>
    <text x="25" y="189" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; 5GHz Attenuation Offset: -6.0 dBm</text>

    <text x="25" y="225" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">2. Weighted RMSE Objective Function:</text>
    <rect x="25" y="235" width="370" height="40" rx="6" fill="#1e293b"/>
    <text x="210" y="260" text-anchor="middle" fill="#00e676" font-family="monospace" font-size="12" font-weight="bold">min Cost(P) = &#931; [ w_i &#183; (RSSI_obs - RSSI_exp(P))^2 ]</text>

    <text x="25" y="295" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; Stationary Hub Weight: 3.0x (Fixed Ground Truth)</text>
    <text x="25" y="313" fill="#94a3b8" font-family="sans-serif" font-size="11">&#8226; High SNR Weight Boost: &gt;= -50dBm (2.5x), &gt;= -60dBm (1.8x)</text>

    <text x="25" y="350" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">3. ARCore Coordinate Transform:</text>
    <rect x="25" y="360" width="370" height="95" rx="6" fill="#1e293b"/>
    <text x="40" y="385" fill="#b388ff" font-family="monospace" font-size="11">X_ar = X_origin + (dx &#183; cos&#952; - dy &#183; sin&#952;)</text>
    <text x="40" y="407" fill="#b388ff" font-family="monospace" font-size="11">Z_ar = Z_origin - (dx &#183; sin&#952; + dy &#183; cos&#952;)</text>
    <text x="40" y="429" fill="#b388ff" font-family="monospace" font-size="11">Y_ar = Y_origin + dz (Vertical Alignment)</text>
    <text x="25" y="475" fill="#64748b" font-family="sans-serif" font-size="10">Locks ARCore camera world to physical room coordinates at Corner 1</text>
  </g>

  <!-- Right: 3D Room Grid & Trilateration Geometry -->
  <g transform="translate(500, 100)">
    <rect width="650" height="490" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="650" height="36" rx="12" fill="#1e293b"/>
    <text x="325" y="24" text-anchor="middle" fill="#00e676" font-family="sans-serif" font-size="13" font-weight="bold">4-CORNER GEOMETRIC TRILATERATION INTERSECTION</text>

    <!-- Room Border Polygon (Isometric/Top view) -->
    <polygon points="60,380 325,450 580,380 325,120" fill="#162033" stroke="#3b82f6" stroke-width="2"/>

    <!-- Grid lines -->
    <line x1="60" y1="380" x2="325" y2="120" stroke="#1e293b" stroke-width="1"/>
    <line x1="325" y1="450" x2="580" y2="380" stroke="#1e293b" stroke-width="1"/>
    <line x1="192" y1="415" x2="452" y2="250" stroke="#1e293b" stroke-width="1"/>
    <line x1="452" y1="415" x2="192" y2="250" stroke="#1e293b" stroke-width="1"/>

    <!-- Corner 1: Origin -->
    <circle cx="60" cy="380" r="10" fill="#00e5ff"/>
    <text x="50" y="415" fill="#00e5ff" font-family="sans-serif" font-size="11" font-weight="bold">Corner 1: HUB-E44C6D</text>
    <text x="50" y="432" fill="#94a3b8" font-family="monospace" font-size="10">(0.0, 0.0, 0.0)</text>

    <!-- Corner 2 -->
    <circle cx="325" cy="450" r="10" fill="#b388ff"/>
    <text x="240" y="475" fill="#b388ff" font-family="sans-serif" font-size="11" font-weight="bold">Corner 2: HUB-8D5EA1</text>
    <text x="265" y="488" fill="#94a3b8" font-family="monospace" font-size="10">(-1.56, 8.70)</text>

    <!-- Corner 3 -->
    <circle cx="580" cy="380" r="10" fill="#b388ff"/>
    <text x="480" y="415" fill="#b388ff" font-family="sans-serif" font-size="11" font-weight="bold">Corner 3: HUB-3D8C0D</text>
    <text x="500" y="432" fill="#94a3b8" font-family="monospace" font-size="10">(-2.56, 11.94)</text>

    <!-- Corner 4 -->
    <circle cx="325" cy="120" r="10" fill="#b388ff"/>
    <text x="240" y="100" fill="#b388ff" font-family="sans-serif" font-size="11" font-weight="bold">Corner 4: HUB-C64D96</text>
    <text x="260" y="85" fill="#94a3b8" font-family="monospace" font-size="10">(-11.32, 10.85)</text>

    <!-- Trilateration circles from corners to estimated AP -->
    <circle cx="60" cy="380" r="230" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    <circle cx="325" cy="450" r="180" fill="none" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    <circle cx="580" cy="380" r="220" fill="none" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    <circle cx="325" cy="120" r="210" fill="none" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

    <!-- Intersection: Target Access Point -->
    <circle cx="280" cy="280" r="14" fill="#00e676" stroke="#ffffff" stroke-width="2"/>
    <circle cx="280" cy="280" r="38" fill="#00e676" fill-opacity="0.15" stroke="#00e676" stroke-width="1.5"/>
    <text x="305" y="275" fill="#00e676" font-family="sans-serif" font-size="13" font-weight="bold">TARGET AP (SOLVED)</text>
    <text x="305" y="293" fill="#ffffff" font-family="monospace" font-size="11">Estimated: (-2.08m, 1.92m, 0.60m)</text>
    <text x="305" y="310" fill="#38bdf8" font-family="sans-serif" font-size="10">Confidence: 94% &#8226; Error: &#177;1.8m</text>
  </g>
</svg>